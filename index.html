<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cipher Challenge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #9ca3af;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        textarea,
        input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        textarea:focus,
        input:focus {
            border-color: #2563eb;
        }

        .form-group {
            margin-bottom: 18px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .secondary:hover {
            background: #d1d5db;
        }

        .message {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .cipher {
            background: #111827;
            color: #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .date {
            font-size: 13px;
            color: #6b7280;
        }

        .decrypt-box {
            display: flex;
            gap: 10px;
        }

        .decrypt-box input {
            flex: 1;
        }

        .result {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .loading {
            text-align: center;
            color: #6b7280;
            padding: 20px;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 30px;
        }

        .counter {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        @media (max-width: 700px) {
            header {
                padding: 20px;
            }

            .container {
                width: 94%;
            }

            .decrypt-box {
                flex-direction: column;
            }

            .message-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🔐 Cipher Challenge</h1>

    <p>
        Encrypt a message, publish the ciphertext,
        and challenge others to decrypt it.
    </p>
</header>


<div class="container">

    <!-- CREATE CIPHER -->

    <div class="card">

        <h2>Publish a Cipher</h2>

        <div class="form-group">

            <label for="message">
                Secret Message
            </label>

            <textarea
                id="message"
                placeholder="Enter your secret message..."
            ></textarea>

        </div>


        <div class="form-group">

            <label for="key">
                Secret Key
            </label>

            <input
                type="password"
                id="key"
                placeholder="Enter your secret key..."
            >

        </div>


        <button
            class="primary"
            id="publishButton"
            onclick="publishMessage()"
        >
            🔒 Encrypt & Publish
        </button>


        <div
            id="publishStatus"
            class="status"
        ></div>

    </div>


    <!-- PUBLIC FEED -->

    <div class="card">

        <div style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        ">

            <h2>
                Public Cipher Feed
            </h2>

            <button
                class="secondary"
                onclick="loadMessages()"
            >
                🔄 Refresh
            </button>

        </div>


        <div
            id="counter"
            class="counter"
        ></div>


        <div id="feed">

            <div class="loading">
                Loading ciphers...
            </div>

        </div>

    </div>

</div>


<script>

/*
=========================================================
GOOGLE APPS SCRIPT WEB APP
=========================================================
*/

const API_URL =
    "https://script.google.com/macros/s/AKfycbww_RiaQIsB1SxNOigWAoT-RZ13VeIo8A5zevQkZJD2STPP5534_crzG0r1TaKCd47rSw/exec";


/*
=========================================================
DERIVE AES KEY
=========================================================
*/

async function deriveKey(password, salt) {

    const encoder =
        new TextEncoder();

    const passwordData =
        encoder.encode(password);


    const baseKey =
        await crypto.subtle.importKey(

            "raw",

            passwordData,

            {
                name: "PBKDF2"
            },

            false,

            [
                "deriveKey"
            ]

        );


    return await crypto.subtle.deriveKey(

        {
            name: "PBKDF2",

            salt: salt,

            iterations: 100000,

            hash: "SHA-256"
        },

        baseKey,

        {
            name: "AES-GCM",

            length: 256
        },

        false,

        [
            "encrypt",
            "decrypt"
        ]

    );
}


/*
=========================================================
ENCRYPT MESSAGE
=========================================================
*/

async function encryptMessage(
    message,
    password
) {

    const encoder =
        new TextEncoder();


    /*
    Generate random salt
    */

    const salt =
        crypto.getRandomValues(
            new Uint8Array(16)
        );


    /*
    Generate random IV
    */

    const iv =
        crypto.getRandomValues(
            new Uint8Array(12)
        );


    /*
    Create encryption key
    */

    const key =
        await deriveKey(
            password,
            salt
        );


    /*
    Encrypt message
    */

    const encrypted =
        await crypto.subtle.encrypt(

            {
                name: "AES-GCM",

                iv: iv
            },

            key,

            encoder.encode(message)

        );


    /*
    Convert encrypted data to Base64
    */

    const cipherText =
        arrayBufferToBase64(
            encrypted
        );


    /*
    Return everything needed
    for decryption.
    */

    return {

        cipherText: cipherText,

        iv:
            arrayBufferToBase64(iv),

        salt:
            arrayBufferToBase64(salt)

    };
}


/*
=========================================================
DECRYPT MESSAGE
=========================================================
*/

async function decryptMessage(
    cipherText,
    password,
    ivBase64,
    saltBase64
) {

    try {

        const encrypted =
            base64ToArrayBuffer(
                cipherText
            );


        const iv =
            base64ToArrayBuffer(
                ivBase64
            );


        const salt =
            base64ToArrayBuffer(
                saltBase64
            );


        /*
        Recreate encryption key
        */

        const key =
            await deriveKey(
                password,
                salt
            );


        /*
        Decrypt
        */

        const decrypted =
            await crypto.subtle.decrypt(

                {
                    name: "AES-GCM",

                    iv: iv
                },

                key,

                encrypted

            );


        return new TextDecoder()
            .decode(decrypted);

    }

    catch (error) {

        throw new Error(
            "Incorrect key."
        );

    }
}


/*
=========================================================
ARRAY BUFFER → BASE64
=========================================================
*/

function arrayBufferToBase64(buffer) {

    const bytes =
        new Uint8Array(buffer);

    let binary = "";


    for (
        let i = 0;
        i < bytes.length;
        i++
    ) {

        binary += String.fromCharCode(
            bytes[i]
        );

    }


    return btoa(binary);
}


/*
=========================================================
BASE64 → ARRAY BUFFER
=========================================================
*/

function base64ToArrayBuffer(base64) {

    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes.buffer;
}


/*
=========================================================
PUBLISH MESSAGE
=========================================================
*/

async function publishMessage() {

    const message =
        document
            .getElementById("message")
            .value
            .trim();


    const key =
        document
            .getElementById("key")
            .value;


    const status =
        document
            .getElementById(
                "publishStatus"
            );


    const button =
        document
            .getElementById(
                "publishButton"
            );


    /*
    Validate message
    */

    if (!message) {

        showStatus(
            status,
            "Please enter a secret message.",
            false
        );

        return;
    }


    /*
    Validate key
    */

    if (!key) {

        showStatus(
            status,
            "Please enter a secret key.",
            false
        );

        return;
    }


    try {

        button.disabled = true;

        button.textContent =
            "🔄 Encrypting...";


        showStatus(
            status,
            "Encrypting your message...",
            true
        );


        /*
        Encrypt locally
        */

        const encrypted =
            await encryptMessage(
                message,
                key
            );


        /*
        Package encrypted data.

        IV and Salt are included inside
        CipherText so the public feed
        can decrypt when the correct
        key is provided.
        */

        const cipherPackage =
            btoa(

                JSON.stringify({

                    data:
                        encrypted.cipherText,

                    iv:
                        encrypted.iv,

                    salt:
                        encrypted.salt

                })

            );


        /*
        Send data to Google Apps Script
        */

        const response =
            await fetch(

                API_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action: "save",

                            cipherText:
                                cipherPackage,

                            plaintext:
                                message,

                            key:
                                key

                        })

                }

            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Failed to save message."
            );

        }


        /*
        Success
        */

        showStatus(
            status,
            "✅ Cipher published successfully!",
            true
        );


        /*
        Clear fields
        */

        document
            .getElementById("message")
            .value = "";


        document
            .getElementById("key")
            .value = "";


        /*
        Reload public feed
        */

        await loadMessages();


    }

    catch (error) {

        console.error(error);


        showStatus(
            status,
            "❌ Failed to publish: " +
            error.message,
            false
        );

    }

    finally {

        button.disabled = false;

        button.textContent =
            "🔒 Encrypt & Publish";

    }

}


/*
=========================================================
LOAD PUBLIC FEED
=========================================================
*/

async function loadMessages() {

    const feed =
        document.getElementById(
            "feed"
        );


    const counter =
        document.getElementById(
            "counter"
        );


    feed.innerHTML =
        `
        <div class="loading">
            🔄 Loading ciphers...
        </div>
        `;


    try {

        const response =
            await fetch(

                API_URL +
                "?action=messages"

            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Unable to load messages."
            );

        }


        /*
        No messages
        */

        if (
            !result.messages ||
            result.messages.length === 0
        ) {

            counter.textContent =
                "0 ciphers";


            feed.innerHTML =
                `
                <div class="empty">
                    🔐 No ciphers published yet.
                    <br>
                    Be the first to create one!
                </div>
                `;

            return;
        }


        /*
        Show counter
        */

        counter.textContent =
            result.messages.length +
            (
                result.messages.length === 1
                    ? " cipher"
                    : " ciphers"
            );


        /*
        Clear feed
        */

        feed.innerHTML = "";


        /*
        Create cards
        */

        result.messages.forEach(
            (message, index) => {

                createMessageCard(
                    message,
                    index,
                    feed
                );

            }
        );

    }

    catch (error) {

        console.error(error);


        counter.textContent =
            "";


        feed.innerHTML =
            `
            <div
                class="result error"
                style="display:block"
            >
                ❌ Failed to load the public feed.

                <br><br>

                ${escapeHtml(
                    error.message
                )}
            </div>
            `;

    }

}


/*
=========================================================
CREATE MESSAGE CARD
=========================================================
*/

function createMessageCard(
    message,
    index,
    feed
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "message";


    /*
    Format timestamp
    */

    const date =
        formatDate(
            message.timestamp
        );


    card.innerHTML = `

        <div class="message-header">

            <strong>
                🔐 Cipher #${index + 1}
            </strong>

            <span class="date">
                ${escapeHtml(date)}
            </span>

        </div>


        <div class="cipher">
            ${escapeHtml(
                message.cipherText
            )}
        </div>


        <div class="decrypt-box">

            <input
                type="password"
                id="decryptKey-${index}"
                placeholder="Enter secret key..."
            >


            <button
                class="primary"
                onclick="tryDecrypt(${index})"
            >
                🔓 Decrypt
            </button>

        </div>


        <div
            id="result-${index}"
            class="result"
        ></div>

    `;


    /*
    Store CipherText
    */

    card.dataset.cipherText =
        message.cipherText;


    /*
    Allow Enter key to decrypt
    */

    const input =
        card.querySelector(
            "input"
        );


    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                tryDecrypt(index);

            }

        }
    );


    feed.appendChild(card);
}


/*
=========================================================
TRY TO DECRYPT
=========================================================
*/

async function tryDecrypt(index) {

    const input =
        document.getElementById(
            `decryptKey-${index}`
        );


    const result =
        document.getElementById(
            `result-${index}`
        );


    const key =
        input.value;


    /*
    Validate key
    */

    if (!key) {

        result.className =
            "result error";


        result.style.display =
            "block";


        result.textContent =
            "Please enter a key.";


        return;
    }


    try {

        result.className =
            "result";


        result.style.display =
            "block";


        result.textContent =
            "🔄 Trying to decrypt...";


        /*
        Get card
        */

        const cards =
            document.querySelectorAll(
                ".message"
            );


        const card =
            cards[index];


        const cipherText =
            card.dataset.cipherText;


        /*
        Decode cipher package
        */

        const packageData =
            JSON.parse(

                atob(
                    cipherText
                )

            );


        /*
        Decrypt
        */

        const decrypted =
            await decryptMessage(

                packageData.data,

                key,

                packageData.iv,

                packageData.salt

            );


        /*
        Success
        */

        result.className =
            "result success";


        result.style.display =
            "block";


        result.innerHTML =
            `
            <strong>
                ✅ Successfully Decrypted!
            </strong>

            <br><br>

            ${escapeHtml(
                decrypted
            )}
            `;

    }

    catch (error) {

        /*
        Wrong key
        */

        result.className =
            "result error";


        result.style.display =
            "block";


        result.innerHTML =
            `
            ❌ <strong>Incorrect key.</strong>
            <br>
            Try another key.
            `;

    }

}


/*
=========================================================
STATUS MESSAGE
=========================================================
*/

function showStatus(
    element,
    message,
    success
) {

    element.style.display =
        "block";


    element.className =
        success
            ? "status success"
            : "status error";


    element.textContent =
        message;

}


/*
=========================================================
FORMAT DATE
=========================================================
*/

function formatDate(value) {

    if (!value) {
        return "Unknown date";
    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleString();

}


/*
=========================================================
ESCAPE HTML
=========================================================
*/

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}


/*
=========================================================
INITIALIZE
=========================================================
*/

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadMessages();

    }
);

</script>

</body>
</html>
